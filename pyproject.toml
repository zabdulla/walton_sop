[project]
name = "walton-sop"
version = "0.1.0"
description = "Algorithmic trading research framework with built-in anti-overfitting safeguards"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "scipy>=1.10",
]

[project.optional-dependencies]
data = [
    "yfinance>=0.2",
]
notebooks = [
    "jupyter>=1.0",
]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]
include = ["walton*"]
